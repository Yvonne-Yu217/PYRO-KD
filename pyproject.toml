authors = [
    { name = "Daksh Shah", email = "daksh.shah15@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "torchmetrics>=1.8.2",
    "opencv-python>=4.13.0.92",
    "librosa>=1.0.0",
    "silero-vad>=6.2.3",
